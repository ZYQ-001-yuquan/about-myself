<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>个人介绍</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700&family=Playfair+Display:wght@400;600&display=swap');
    
    :root {
      --bg: #0a0a0f;
      --fg: #f5f5f7;
      --muted: #6e6e73;
      --accent: #ff6b35;
      --card: rgba(255,255,255,0.03);
      --border: rgba(255,255,255,0.08);
    }
    
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: 'Noto Sans SC', sans-serif;
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow-x: hidden;
    }
    
    .bg-pattern {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(ellipse at 20% 20%, rgba(255,107,53,0.08) 0%, transparent 50%),
        radial-gradient(ellipse at 80% 80%, rgba(99,102,241,0.06) 0%, transparent 50%);
      pointer-events: none;
    }
    
    .container {
      position: relative;
      max-width: 600px;
      width: 90%;
      padding: 60px 40px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 24px;
      backdrop-filter: blur(20px);
      text-align: center;
    }
    
    .avatar {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin: 0 auto 24px;
      box-shadow: 0 20px 40px rgba(255,107,53,0.2);
    }
    
    .name {
      font-family: 'Playfair Display', serif;
      font-size: 36px;
      font-weight: 600;
      margin-bottom: 8px;
      letter-spacing: -0.5px;
    }
    
    .title {
      color: var(--accent);
      font-size: 14px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 24px;
    }
    
    .bio {
      color: var(--muted);
      font-size: 16px;
      line-height: 1.7;
      margin-bottom: 32px;
      font-weight: 300;
    }
    
    .skills {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-bottom: 32px;
    }
    
    .skill {
      padding: 8px 16px;
      background: rgba(255,107,53,0.1);
      border: 1px solid rgba(255,107,53,0.2);
      border-radius: 20px;
      font-size: 13px;
      color: var(--fg);
      transition: all 0.3s ease;
    }
    
    .skill:hover {
      background: rgba(255,107,53,0.2);
      transform: translateY(-2px);
    }
    
    .links {
      display: flex;
      gap: 16px;
      justify-content: center;
    }
    
    .link {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 1px solid var(--border);
      display: flex;
      align-items: center;
      justify-content: center;
      color: var(--muted);
      text-decoration: none;
      transition: all 0.3s ease;
      font-size: 18px;
    }
    
    .link:hover {
      border-color: var(--accent);
      color: var(--accent);
      transform: translateY(-3px);
    }
    
    .divider {
      width: 60px;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      margin: 0 auto 24px;
    }
    
    @media (max-width: 480px) {
      .container {
        padding: 40px 24px;
      }
      .name {
        font-size: 28px;
      }
    }
  </style>
</head>
<body>
  <div class="bg-pattern"></div>
  <div class="container">
    <img src="./ceac5358-873e-4d09-b5a7-5c214de0a68a.jpg" class="avatar" alt="头像" style="object-fit: cover; border-radius: 50%;">
    <h1 class="name">周羽泉</h1>
    <p class="title">陕西交通职业技术学院 · 新能源汽车技术专业</p>
    <div class="divider"></div>
    <p class="bio">陕西乾县人，专业成绩排名前30%，加权平均分82.38/100。<br><br>主修课程：机械基础、汽车构造、电工技术、底盘技术、智能网联、新能源汽车排障等。</p>
    <div class="skills">
      <span class="skill">Python</span>
      <span class="skill">C编程</span>
      <span class="skill">新能源汽车技术</span>
      <span class="skill">智能网联</span>
    </div>
    <div class="links">
      <a href="mailto:2872637143@qq.com" class="link" title="邮箱">📧</a>
      <a href="#" class="link" title="微信">💬</a>
    </div>
  </div>
</body>
</html>
